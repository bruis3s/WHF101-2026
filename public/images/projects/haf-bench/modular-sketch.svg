<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <rect width="600" height="700" fill="#fcfbf9" />

  <!-- Perimeter Border & Title Block -->
  <rect x="20" y="20" width="560" height="660" fill="none" stroke="#222" stroke-width="1.2" />
  <line x1="20" y1="620" x2="580" y2="620" stroke="#222" stroke-width="1" />
  <line x1="380" y1="620" x2="380" y2="680" stroke="#222" stroke-width="1" />

  <!-- Metadata Text in Title Block -->
  <text x="35" y="642" font-family="monospace" font-size="10" font-weight="bold" fill="#111" letter-spacing="1">PROJECT: HAF MODULAR RING BENCH</text>
  <text x="35" y="658" font-family="monospace" font-size="9" fill="#555">SERIES: HW-101 / EXP-04B</text>
  <text x="35" y="671" font-family="monospace" font-size="8.5" fill="#777">CLIENT: WERKS GALLERIA / TOKYO</text>
  <text x="395" y="642" font-family="monospace" font-size="9" fill="#222">SHEET: 04 OF 12</text>
  <text x="395" y="658" font-family="monospace" font-size="9" fill="#222">SCALE: N.T.S.</text>
  <text x="395" y="671" font-family="monospace" font-size="9" fill="#222">DATE: 2026.04.18</text>

  <!-- Axonometric Assembly Diagram (Upper Half) -->
  <g transform="translate(140, 90)">
    <!-- Exploded Arc Plate -->
    <path d="M 0,60 Q 150,0 300,70 L 280,120 Q 150,55 0,110 Z" fill="none" stroke="#111" stroke-width="1.5" />
    <path d="M 0,60 L 0,80 L 280,140 L 280,120" fill="none" stroke="#111" stroke-width="1" />
    <line x1="300" y1="70" x2="300" y2="90" stroke="#111" stroke-width="1" />
    <line x1="280" y1="140" x2="300" y2="90" stroke="#111" stroke-width="1" />

    <!-- Exploded Acrylic Legs Below with dashed alignment projection lines -->
    <line x1="20" y1="110" x2="20" y2="180" stroke="#999" stroke-width="0.8" stroke-dasharray="3 3" />
    <line x1="150" y1="85" x2="150" y2="160" stroke="#999" stroke-width="0.8" stroke-dasharray="3 3" />
    <line x1="280" y1="120" x2="280" y2="190" stroke="#999" stroke-width="0.8" stroke-dasharray="3 3" />

    <!-- Leg 1 -->
    <polygon points="10,180 30,175 30,240 10,245" fill="none" stroke="#111" stroke-width="1.2" />
    <line x1="10" y1="180" x2="10" y2="245" stroke="#111" stroke-width="1.2" />
    <!-- Leg 2 -->
    <polygon points="140,160 160,155 160,220 140,225" fill="none" stroke="#111" stroke-width="1.2" />
    <!-- Leg 3 -->
    <polygon points="270,190 290,185 290,250 270,255" fill="none" stroke="#111" stroke-width="1.2" />

    <!-- Bolt indicators -->
    <circle cx="20" cy="188" r="2.5" fill="#111" />
    <circle cx="150" cy="168" r="2.5" fill="#111" />
    <circle cx="280" cy="198" r="2.5" fill="#111" />

    <!-- Dimension arrows -->
    <line x1="0" y1="40" x2="300" y2="50" stroke="#444" stroke-width="0.6" />
    <text x="150" y="35" font-family="monospace" font-size="8" fill="#444" text-anchor="middle">ARC LENGTH = 1,414 MM</text>
  </g>

  <!-- Lower Left: Site Plan Sketch with stone void -->
  <g transform="translate(60, 380)">
    <circle cx="90" cy="90" r="70" fill="none" stroke="#222" stroke-width="1.2" />
    <circle cx="90" cy="90" r="45" fill="none" stroke="#777" stroke-dasharray="2 2" stroke-width="0.8" />
    
    <!-- Stone Cluster representation -->
    <polygon points="80,85 100,80 105,95 90,105 75,98" fill="#888" stroke="#333" stroke-width="0.8" />
    <polygon points="65,90 75,85 70,100" fill="#aaa" stroke="#333" stroke-width="0.6" />
    <polygon points="102,96 112,90 115,102 105,105" fill="#999" stroke="#333" stroke-width="0.6" />

    <text x="90" y="195" font-family="monospace" font-size="8" fill="#333" text-anchor="middle">01 / RADIAL SITE CORE</text>
  </g>

  <!-- Lower Right: Material Specs and Joint Diagram -->
  <g transform="translate(320, 380)">
    <rect x="0" y="10" width="200" height="150" fill="none" stroke="#deded8" stroke-width="1" />
    <text x="12" y="32" font-family="monospace" font-size="8.5" font-weight="bold" fill="#111">MATERIAL SCHEDULE</text>
    <line x1="12" y1="40" x2="188" y2="40" stroke="#eee" />

    <text x="12" y="58" font-family="monospace" font-size="7.5" fill="#444">01. TOP SURFACE</text>
    <text x="12" y="70" font-family="monospace" font-size="7" fill="#777">    Perforated Alum 4.0mm (Anodized Natural)</text>

    <text x="12" y="90" font-family="monospace" font-size="7.5" fill="#444">02. SUPPORT BLADES</text>
    <text x="12" y="102" font-family="monospace" font-size="7" fill="#777">    Cast Acrylic PMMA 35mm (Polished Chamfer)</text>

    <text x="12" y="122" font-family="monospace" font-size="7.5" fill="#444">03. STRUCTURAL VOID</text>
    <text x="12" y="134" font-family="monospace" font-size="7" fill="#777">    Selected Local Granite / Dry Stack Core</text>

    <text x="100" y="195" font-family="monospace" font-size="8" fill="#333" text-anchor="middle">02 / JOINT SPECIFICATION</text>
  </g>
</svg>
