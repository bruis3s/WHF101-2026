<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="steel-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f2ed" />
      <stop offset="50%" stop-color="#cfc9bf" />
      <stop offset="100%" stop-color="#999388" />
    </linearGradient>
    <filter id="bracket-shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity="0.2" />
    </filter>
  </defs>

  <g filter="url(#bracket-shadow)">
    <!-- Base Plate -->
    <rect x="25" y="25" width="110" height="110" rx="6" fill="url(#steel-grad)" stroke="#47433c" stroke-width="1.2" />
    <rect x="30" y="30" width="100" height="100" rx="4" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6" />

    <!-- Center Bushing Void -->
    <circle cx="80" cy="80" r="24" fill="#302d28" stroke="#1a1815" stroke-width="1.5" />
    <circle cx="80" cy="80" r="14" fill="#cfc9bf" stroke="#666" stroke-width="1" />
    <circle cx="80" cy="80" r="6" fill="#151515" />

    <!-- Corner M8 Mounting Holes -->
    <circle cx="45" cy="45" r="5" fill="#333" stroke="#aaa" stroke-width="0.8" />
    <circle cx="115" cy="45" r="5" fill="#333" stroke="#aaa" stroke-width="0.8" />
    <circle cx="45" cy="115" r="5" fill="#333" stroke="#aaa" stroke-width="0.8" />
    <circle cx="115" cy="115" r="5" fill="#333" stroke="#aaa" stroke-width="0.8" />

    <!-- Alignment Crosshairs -->
    <line x1="80" y1="28" x2="80" y2="38" stroke="#111" stroke-width="0.8" />
    <line x1="80" y1="122" x2="80" y2="132" stroke="#111" stroke-width="0.8" />
    <line x1="28" y1="80" x2="38" y2="80" stroke="#111" stroke-width="0.8" />
    <line x1="122" y1="80" x2="132" y2="80" stroke="#111" stroke-width="0.8" />
  </g>

  <text x="80" y="152" font-family="monospace" font-size="8.5" fill="#222" text-anchor="middle" letter-spacing="1">M12 FIXING HUB / 316-SS</text>
</svg>
