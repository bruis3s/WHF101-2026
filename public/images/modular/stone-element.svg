<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="100%" height="100%">
  <defs>
    <radialGradient id="granite-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#b8b1a7" />
      <stop offset="50%" stop-color="#8a8378" />
      <stop offset="85%" stop-color="#5a544b" />
      <stop offset="100%" stop-color="#3d3831" />
    </radialGradient>
    <filter id="stone-shadow">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#stone-shadow)">
    <!-- Faceted Granite Boulder -->
    <polygon points="30,90 60,35 125,25 170,60 175,120 135,155 70,160 35,130" fill="url(#granite-grad)" stroke="#2f2b26" stroke-width="1.2" />
    <!-- Facet planes for 3D rock structure -->
    <polygon points="60,35 125,25 105,80 60,75" fill="#c4bdb3" opacity="0.4" />
    <polygon points="125,25 170,60 145,100 105,80" fill="#a49c90" opacity="0.3" />
    <polygon points="170,60 175,120 135,115 145,100" fill="#4d473f" opacity="0.4" />
    <polygon points="30,90 60,75 105,80 90,140 70,160 35,130" fill="#7d766b" opacity="0.5" />
    <polygon points="105,80 145,100 135,155 90,140" fill="#655e54" opacity="0.6" />

    <!-- Mineral specks -->
    <circle cx="85" cy="55" r="1.5" fill="#f0ece6" />
    <circle cx="115" cy="65" r="1.2" fill="#2b2825" />
    <circle cx="75" cy="115" r="1.8" fill="#f0ece6" />
    <circle cx="130" cy="120" r="1.4" fill="#2b2825" />
    <circle cx="150" cy="85" r="1" fill="#f0ece6" />
  </g>

  <text x="100" y="174" font-family="monospace" font-size="9" fill="#111" text-anchor="middle" letter-spacing="1">NATURAL GRANITE / 45KG</text>
</svg>
